name: Update language analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/update_languages.py"
      - ".github/workflows/update-languages.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-languages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refresh language analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_languages.py
      - name: Commit changed generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated/languages.md
          git diff --cached --quiet || git commit -m "docs: update language analysis"
          git push
